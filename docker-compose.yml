# Run:  docker compose up -d --build   then open http://localhost:8080
# Change the port:  PORT=3000 docker compose up -d --build
services:
  patente:
    build: .
    image: nyttevaerdien/patente-guida:1.3.0
    container_name: patente-guida
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./storage:/data
    restart: unless-stopped
